name: Deploy to Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch:  # allows manual trigger from GitHub UI

env:
  RESOURCE_GROUP: ak-rg-geo-evaluator
  ACR_NAME: geoevaluatoracr
  APP_NAME: geo-evaluator

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push image to ACR
        run: |
          az acr build \
            --registry $ACR_NAME \
            --image geo-evaluator:${{ github.sha }} \
            --image geo-evaluator:latest \
            .

      - name: Deploy to Container Apps
        run: |
          az containerapp update \
            --name $APP_NAME \
            --resource-group $RESOURCE_GROUP \
            --image $ACR_NAME.azurecr.io/geo-evaluator:${{ github.sha }}

      - name: Print app URL
        run: |
          URL=$(az containerapp show \
            --name $APP_NAME \
            --resource-group $RESOURCE_GROUP \
            --query properties.configuration.ingress.fqdn \
            --output tsv)
          echo "App live at: https://$URL"
