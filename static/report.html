<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brand Report — Loading…</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
</head>
<body class="report-body">

<div class="report-layout">

  <!-- ── Sidebar ── -->
  <aside class="report-sidebar">
    <div class="sidebar-inner">

      <a href="/" class="sidebar-back">← All reports</a>

      <div class="sidebar-brand-block">
        <div class="sidebar-eval-label">BRAND EVALUATION</div>
        <div id="sidebar-brand-name" class="sidebar-brand-name">Loading…</div>
        <div id="sidebar-brand-meta" class="sidebar-brand-meta">—</div>
        <div id="sidebar-status"></div>
      </div>

      <div class="sidebar-progress-block">
        <div class="sidebar-progress-header">
          <span id="sidebar-progress-text" class="sidebar-progress-text">Initializing…</span>
          <span id="sidebar-progress-fraction" class="sidebar-progress-fraction">0 / 15</span>
        </div>
        <div class="progress-track">
          <div id="sidebar-progress-bar" class="progress-bar" style="width:0%"></div>
        </div>
      </div>

      <button id="sidebar-pdf-btn" class="btn-success sidebar-pdf-btn hidden" onclick="downloadPdf()">
        ↓ Download PDF
      </button>

      <nav class="sidebar-nav" id="sidebar-nav" aria-label="Report sections">
        <!-- Generated by report.js -->
      </nav>

    </div>
  </aside>

  <!-- ── Main content ── -->
  <main class="report-main">

    <!-- Section cards -->
    <div id="sections-container"></div>

    <!-- Error -->
    <div id="error-card" class="surface state-card hidden" role="alert">
      <div class="state-icon">⚠</div>
      <div id="error-message" class="error-text">An error occurred.</div>
      <a href="/" class="btn-ghost" style="margin-top:.5rem">← Back to reports</a>
    </div>

    <!-- Loading -->
    <div id="loading-card" class="surface state-card">
      <span class="spinner spinner-dark spinner-lg"></span>
      <div style="font-size:.875rem;color:var(--token-text-secondary);">Loading report…</div>
    </div>

  </main>
</div>

<!-- ── Chat FAB + Drawer ── -->
<button class="chat-fab" id="chat-fab" aria-label="Ask about this report" title="Ask about this report">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
  </svg>
</button>

<div class="chat-drawer" id="chat-drawer" role="dialog" aria-label="Report assistant">
  <div class="chat-drawer-header">
    <div>
      <div class="chat-drawer-title">Ask the Report</div>
      <div class="chat-drawer-subtitle">Powered by Claude Haiku</div>
    </div>
    <button class="chat-close-btn" id="chat-close" aria-label="Close">✕</button>
  </div>
  <div class="chat-messages" id="chat-messages">
    <div class="chat-empty">
      <strong>Ask anything about this brand</strong>
      Dig deeper into any finding, compare competitors, explore recommendations, or ask for context.
    </div>
  </div>
  <div class="chat-input-row">
    <textarea class="chat-input" id="chat-input" placeholder="Ask a question…" rows="1"></textarea>
    <button class="chat-send-btn" id="chat-send" disabled>Send</button>
  </div>
</div>

<script src="/static/js/report.js"></script>
</body>
</html>
